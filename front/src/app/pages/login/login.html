<div class="login-container">
  <div class="login-title">
    <h2 id="log-log">Login</h2>
    <h4 (click)="goToRegister()" class="signup-link">Sign Up</h4>
  </div>
  <div class="contenedor3d" #canvasContainer></div>

  <div class="login-card">

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <input type="email" formControlName="email" placeholder="Email">

      <input type="password" formControlName="password" placeholder="Password">

      <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
    </form>

      <p><strong>Cuentas de prueba:</strong></p>
      <p> Usuario: user@test.com / 123456</p>
      <p> Admin: admin@test.com / admin123</p>
    </div> -->

  </div>

</div>
