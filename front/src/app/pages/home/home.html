<!-- Canvas para el modelo 3D -->
<div class="canvas-wrapper">
  <canvas #canvas></canvas>
</div>

<!-- Contenido de la página -->
<div class="content">
  <!-- Título en esquina superior izquierda -->
  <div class="title-section">
    <h1 class="main-title" [style.transform]="'translateX(' + titleOffset + 'px)'">
      Discover
    </h1>

  </div>

  <div class="bottom-content">
    <div class="info-section" [style.transform]="'translateY(' + infoOffset + 'px)'">
      <div class="info-card">
        <div class="info-text">Hear bout all the left out Nike's models</div>
      </div>

      <div class="info-card" [style.transitionDelay]="'0.2s'">
        <div class="info-number">3D</div>

      </div>
 <div class="info-card" [style.transitionDelay]="'0.2s'">
       <div class="info-title">MODEL INFO</div>
       </div>
        <div class="info-card" [style.transitionDelay]="'0.2s'">
        <div class="info-text">Only 100 pieces worldwide, each with unique serial number</div>
        </div>
    </div>

    <div class="footer-section" [style.opacity]="footerOpacity">
      <div class="footer-text">

        <span class="scroll-indicator">↓ SCROLL TO DISCOVER ↓</span>
      </div>
    </div>
  </div>

</div>
