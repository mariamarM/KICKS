<div class="orders-container">
  <div class="orders-header">
    <h1>MI PEDIDO</h1>
    <p>Revisa tus zapatillas antes de finalizar la compra</p>
  </div>

  <div *ngIf="items.length === 0" class="empty-cart">
    <p>Tu carrito está vacío.</p>
    <button routerLink="/products" class="back-btn">VOLVER AL CATÁLOGO</button>
  </div>

  <div *ngIf="items.length > 0" class="orders-list">
    <div class="order-item" *ngFor="let item of items">
      <div class="item-img">
        <img [src]="item.image_url" [alt]="item.name">
      </div>
      <div class="item-info">
        <h3>{{ item.name }}</h3>
        <p class="item-details">Marca: {{ item.brand }} | Talla: {{ item.selectedSize }}</p>
        <p class="item-price">{{ item.price }}€ x {{ item.quantity }}</p>
      </div>
      <div class="item-actions">
        <button (click)="removeItem(item.id)" class="remove-btn">ELIMINAR</button>
      </div>
    </div>

    <div class="order-summary">
      <div class="summary-line">
        <span>Subtotal</span>
        <span>{{ total }}€</span>
      </div>
      <div class="summary-line total">
        <span>TOTAL</span>
        <span>{{ total }}€</span>
      </div>
      <button (click)="checkout()" class="checkout-btn">FINALIZAR COMPRA</button>
    </div>
  </div>
</div>
