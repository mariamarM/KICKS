<div class="login-container">
  <div class="login-title">
    <h2 id="log-log">Register</h2>
    <h4 routerLink="/login" style="cursor: pointer;">
      Login
    </h4>
    <div class="contenedor3d" #canvasContainer></div>
  </div>
  <div class="login-card">

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      <input type="text" [value]="name" (input)="name = $any($event.target).value" placeholder="Full Name" required>

      <input type="email" [value]="email" (input)="email = $any($event.target).value" placeholder="Email" required>

      <input type="password" [value]="password" (input)="password = $any($event.target).value" placeholder="Password"
        required>

      <button type="submit">Registrarse</button>
    </form>

  </div>

</div>
