<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Sign up</h1>
        <p>Join the KICKS community</p>
      </div>
      <div class="login-footer">
        <a routerLink="/login">Log in</a>
      </div>
      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="name" placeholder="John Doe">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="example@kicks.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="••••••">
        </div>

        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input type="password" formControlName="confirmPassword" placeholder="••••••">
        </div>

        <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="login-btn" [disabled]="registerForm.invalid">CREATE ACCOUNT</button>
      </form>
    </div>

    <div class="canvas-wrapper">
      <div #canvasContainer class="canvas-container"></div>
    </div>
  </div>
</div>
