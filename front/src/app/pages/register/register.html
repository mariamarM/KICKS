<div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>REGISTRO</h1>
          <p>Únete a la comunidad KICKS</p>
        </div>
  
        <form (ngSubmit)="onRegister()">
          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" [(ngModel)]="name" name="name" required placeholder="Tu nombre">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
          </div>
  
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
          </div>

          <div class="form-group">
            <label>Confirmar Contraseña</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="••••••••">
          </div>
  
          <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>
  
          <button type="submit" class="login-btn">CREAR CUENTA</button>
  
          <div class="login-footer">
            <span>¿Ya tienes cuenta?</span>
            <a routerLink="/login">Inicia sesión</a>
          </div>
        </form>
      </div>
  
      <div class="canvas-wrapper">
        <div #canvasContainer class="canvas-container"></div>
      </div>
    </div>
  </div>
